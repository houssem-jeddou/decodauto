# Essai (11/11/2026, livrable 8.3.1b) : lire un PDF de préfecture avec un vrai navigateur sur un serveur de GitHub.
# Branche jetable, jamais fusionnée. Ne touche ni au site ni au déploiement.
name: Essai relevé des arrêtés
on:
  push:
    branches: [outils/essai-releve-arretes]
permissions:
  contents: read
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Navigateur
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p /tmp/e && cd /tmp/e && npm init -y >/dev/null && npm i -s playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cp $GITHUB_WORKSPACE/travaux/outils/essai-navigateur.mjs .
          node essai-navigateur.mjs "https://www.isere.gouv.fr/Actions-de-l-Etat/Securites/Securite-routiere/Equipements-hivernaux-obligatoires-les-regles-a-connaitre-en-Isere" /tmp/isere.pdf || echo ECHEC
          file /tmp/isere.pdf && pdftotext -l 1 /tmp/isere.pdf - | tr -s ' \n' ' ' | cut -c1-700; echo
