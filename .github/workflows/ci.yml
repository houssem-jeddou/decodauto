name: Contrôles et déploiement

on:
  pull_request:
  push:
    branches: [main]
  # Contrôle hebdomadaire (lundi, 6 h 17 UTC) pour les alertes de revue dépassée. Jamais de déploiement.
  # GitHub ne lance les déclenchements planifiés que depuis la branche par défaut (main).
  schedule:
    - cron: '17 6 * * 1'
  # Lancement à la demande (onglet Actions) : contrôles, et vérification de la production sur main seulement (demande
  # de changement n° 26) ; jamais de déploiement.
  workflow_dispatch:

permissions:
  contents: read

# Exécuteur de tous les jobs (demande de changement n° 27) : la variable du dépôt CI_RUNNER, réglée par Houssem à
# « self-hosted » (exécuteur installé dans Ubuntu, sous WSL, sur son PC : minutes gratuites, travaux/etape-8/executeur-wsl.md).
# Sans cette variable, les serveurs de GitHub (ubuntu-latest), qui consomment les minutes du dépôt privé : retour
# arrière sans toucher au code, en supprimant la variable. Les jobs attendent l'exécuteur tant que le PC est éteint ;
# après 24 heures d'attente, GitHub annule le job : il suffit de relancer le passage. Sur l'exécuteur, pas de cache npm
# de GitHub (setup-node) : le dossier ~/.npm reste sur le PC d'un job à l'autre, alors que le cache de GitHub
# téléchargerait environ 150 Mo à chaque job (et les enverrait au premier).

# Un nouveau passage annule celui qu'il remplace sur une pull request, et sur un lancement à la demande hors de main
# (branches d'essai, demande de changement n° 26 : minutes du dépôt privé). Sur main, un passage en cours va au bout
# (un passage encore en attente peut être remplacé par un plus récent, règle de GitHub pour un groupe de concurrence).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  # Le site n'est indexable que si cette variable vaut exactement "true" ET si config/indexation.json vaut true.
  SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}

jobs:
  controles:
    name: Contrôles (schémas, règles, build, liens)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ vars.CI_RUNNER != 'self-hosted' && 'npm' || '' }}
      - name: Installer les dépendances
        run: npm ci
      # Demande de changement n° 18 (scripts/verifier-indexation-durable.ts) : à chaque construction, drapeau à true
      # => variable SITE_INDEXABLE = "true" (sinon tout le site passerait en noindex) et redirections bien formées ; sur
      # une pull request, comparaison avec sa base : jamais de retour au non-indexé, aucune adresse publiée sans
      # redirection 301, date « Mis à jour le » changée seulement avec le contenu, title et H1 changés seulement avec
      # une ligne de config/changements-de-titre.json, 90 jours au moins après le changement précédent. Sur main, la même
      # comparaison se fait avec le dernier déploiement, dans le travail « origine-main » (dont dépend le déploiement).
      - name: Indexation durable (variable, retour au non-indexé, adresses, dates, titres)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            node scripts/verifier-indexation-durable.ts --base "origin/$BASE_REF"
          else
            node scripts/verifier-indexation-durable.ts
          fi
      - name: Schémas et types
        run: npm run schemas
      - name: Tests des règles (pages de test valide et invalides)
        run: npm test
      - name: Construction + script de contrôle
        run: npm run build
      - name: Liens cassés
        run: npm run liens
      - name: Non-indexation, double clé (variable + drapeau) dans les quatre combinaisons
        run: npm run verifier:modes
      - name: Alertes datées (revue dépassée, montant à revérifier, fourchette à revoir), contrôle hebdomadaire seulement
        if: ${{ github.event_name == 'schedule' }}
        run: node scripts/controle.ts --echouer-sur R5-REVUE-DEPASSEE,COUT-A-REVERIFIER,COUT-FOURCHETTE-A-REVOIR
      - name: Conserver le site vérifié
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-verifie
          path: dist
          if-no-files-found: error
          retention-days: 7

  exemples:
    name: Recette des exemples rédigés (jamais déployée)
    # Livrable 6.6 : les pages exemples de exemples/ (une par modèle de page) sont construites avec le site dans
    # dist-exemples, contrôlées comme de vraies pages, puis conservées pour la recette. Ce job ne conditionne pas le
    # déploiement et rien de dist-exemples n'est jamais déployé.
    # Erreurs attendues (--attendu, scripts/lib/attendus.ts), une par ligne, chacune désignée par son code, son fichier
    # et au besoin un extrait ; toute autre erreur fait échouer le job, et un attendu qui ne se produit plus aussi
    # (ATTENDU-ABSENT) :
    #  - R4-VALIDATION-ABSENTE d'un exemple tant que Houssem n'a pas validé son encadré : l'empreinte n'est versée
    #    qu'après sa validation, jamais pour faire passer le contrôle, et l'attendu est retiré dans le même commit ;
    # Aucun attendu aujourd'hui : la page « à propos » (livrable 7.3) est dans src/content depuis le premier lot, les liens « Méthode » mènent à elle.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      AVEC_EXEMPLES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ vars.CI_RUNNER != 'self-hosted' && 'npm' || '' }}
      - name: Installer les dépendances
        run: npm ci
      - name: Construction avec les exemples (dist-exemples)
        run: npx astro build
      - name: Script de contrôle, exemples compris
        run: node scripts/controle.ts --dist dist-exemples --exemples
      - name: Liens cassés
        if: ${{ !cancelled() }}
        run: node scripts/liens.ts --dist dist-exemples --exemples
      - name: Texte rédigé des exemples, tel que rendu (lecture dans ce journal)
        if: ${{ !cancelled() }}
        run: node scripts/texte-exemples.ts dist-exemples
      - name: Lighthouse mobile de la page de chaque modèle (porte de l'étape 8 ; avec les emplacements publicitaires factices de la construction de recette, livrable 7.5b)
        if: ${{ !cancelled() }}
        run: npx lhci autorun --config=lighthouserc-exemples.json
      - name: Scores par page de la recette (médiane de chaque mesure, lecture dans ce journal)
        if: ${{ !cancelled() }}
        run: node scripts/scores-lighthouse.ts .lighthouseci
      - name: Conserver la construction de recette
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exemples-recette
          path: dist-exemples
          if-no-files-found: error
          retention-days: 14

  demo-format-deux:
    name: Démonstration du format 2 (jamais déployée)
    # Lot F1, tâche F1.2 (demande de changement n° 30) : le site construit avec le voyant moteur, le voyant AdBlue et
    # l'accueil au format 2, d'après le brouillon travaux/etape-13/f1/demo/brouillon-format2.json (« Brouillon, jamais
    # validé »), appliqué en mémoire (scripts/lib/demo-format2.ts), dans dist-demo-format2. Tous les contrôles d'aujourd'hui
    # et ceux du format 2 ; seules erreurs attendues, fixées par le script : les empreintes des lignes et des pages du
    # brouillon (R4-EMPREINTE). Ce job ne conditionne pas le déploiement et rien de dist-demo-format2 n'est jamais déployé.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      DEMO_FORMAT2: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ vars.CI_RUNNER != 'self-hosted' && 'npm' || '' }}
      - name: Installer les dépendances
        run: npm ci
      - name: Construction de démonstration (dist-demo-format2)
        run: npx astro build
      - name: Script de contrôle, format 2
        run: node scripts/controle.ts --dist dist-demo-format2 --demo-format2
      - name: Liens cassés
        if: ${{ !cancelled() }}
        run: node scripts/liens.ts --dist dist-demo-format2
      - name: Lighthouse mobile des pages au format 2 (avec les emplacements publicitaires factices)
        if: ${{ !cancelled() }}
        run: npx lhci autorun --config=lighthouserc-demo-format2.json
      - name: Scores par page (médiane de chaque mesure, lecture dans ce journal)
        if: ${{ !cancelled() }}
        run: node scripts/scores-lighthouse.ts .lighthouseci-demo-format2
      - name: Conserver la construction de démonstration
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-format2
          path: dist-demo-format2
          if-no-files-found: error
          retention-days: 14

  lighthouse:
    name: Lighthouse mobile (3 passages)
    needs: controles
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Demande n° 27 : 10,4 à 10,9 minutes chez GitHub le 14/11 pour 17 adresses ; la liste grandit à chaque lot et la
    # vitesse de l'exécuteur du PC n'est pas celle des serveurs de GitHub. Un délai, pas un seuil : les scores exigés
    # ne changent pas.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ vars.CI_RUNNER != 'self-hosted' && 'npm' || '' }}
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-verifie
          path: dist
      - name: Lighthouse (mobile, médiane de 3 passages)
        run: npm run lighthouse
      - name: Scores par page (médiane de chaque mesure, lecture dans ce journal)
        if: ${{ !cancelled() }}
        run: node scripts/scores-lighthouse.ts .lighthouseci
      # Rapports complets seulement si une mesure échoue (demande n° 27) : 58 rapports de 77 Mo en moyenne occupaient
      # 4,5 Go le 15/11, pour 500 Mo de stockage compris dans l'offre gratuite. Les scores de chaque page restent dans
      # le journal du job (étape précédente).
      - name: Conserver les rapports (en cas d'échec)
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-lighthouse
          path: .lighthouseci
          # Dossier caché : sans cette option, upload-artifact ne le conserve pas (« No files were found »).
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  origine-main:
    name: Origine des commits de main (garde-fou de déploiement)
    # Livrable 7.6, demande de changement n° 15 : refuse de déployer si un commit de main, depuis le dernier déploiement,
    # ne vient pas d'une pull request fusionnée dans main (scripts/verifier-origine-main.ts). Couvre l'accident, pas un
    # compte compromis : qui pousse sur main peut retirer ce contrôle dans le même envoi (le workflow exécuté est celui du
    # commit poussé). Un commit direct, relu par Houssem, s'accepte dans config/commits-directs-acceptes.json.
    # Le déploiement en dépend : un échec de lecture bloque, dans le doute on ne déploie pas.
    # Il attend les contrôles : l'association d'un commit à sa pull request peut mettre quelques secondes à apparaître après
    # la fusion, et un déploiement refusé par les contrôles n'a pas besoin d'être vérifié.
    needs: controles
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Aucune dépendance : le script n'utilise que Node, Git et l'API GitHub.
      - name: Vérifier l'origine des commits
        id: origine
        run: node scripts/verifier-origine-main.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Demande de changement n° 18 : sur main, l'indexation durable se compare avec le dernier déploiement (ce qui est en
      # ligne), pas avec l'envoi précédent : une fusion faite sans attendre la CI de sa pull request reste contrôlée, et un
      # envoi refusé ne devient pas la nouvelle référence. Le déploiement dépend de ce travail.
      - name: Indexation durable depuis le dernier déploiement
        env:
          DEPUIS: ${{ steps.origine.outputs.depuis }}
        run: |
          if [ -z "$DEPUIS" ]; then
            echo "::error title=INDEXATION-LECTURE::point de départ introuvable : comparaison impossible, déploiement refusé"
            exit 1
          fi
          node scripts/verifier-indexation-durable.ts --base "$DEPUIS"

  secrets-cloudflare:
    name: Secrets Cloudflare présents ?
    needs: [controles, lighthouse]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      disponibles: ${{ steps.verification.outputs.disponibles }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: verification
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "disponibles=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponibles=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN et/ou CLOUDFLARE_ACCOUNT_ID absents : déploiement ignoré."
          fi

  deploiement:
    name: Déploiement Cloudflare (wrangler deploy)
    # Uniquement si tous les contrôles sont verts, si l'origine des commits de main est vérifiée (garde-fou, livrable 7.6)
    # ET si les deux secrets existent.
    needs: [controles, lighthouse, secrets-cloudflare, origine-main]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.secrets-cloudflare.outputs.disponibles == 'true' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ vars.CI_RUNNER != 'self-hosted' && 'npm' || '' }}
      - run: npm ci
      # On déploie exactement le dossier qui a passé tous les contrôles, sans le reconstruire.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-verifie
          path: dist
      - name: Déployer
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    name: Production en ligne (redirections, noindex, robots.txt, plan du site)
    # Sur main (après un déploiement réussi, chaque semaine, à la demande) : un écart fait échouer le run
    # (notification GitHub) ; juste après un déploiement, seulement s'il persiste au dernier de 4 passages
    # (propagation de Cloudflare), les écarts passagers restant affichés en avertissement. Plus de passage sur une pull
    # request ni sur une autre branche (demande de changement n° 26) : il n'y était qu'informatif (avertissements, job
    # toujours vert), la production n'ayant pas encore les changements de la branche, et coûtait une minute par passage.
    needs: deploiement
    if: ${{ !cancelled() && (needs.deploiement.result == 'success' || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Après un déploiement : jusqu'à 4 passages, sans nouveau passage au-delà de 4 minutes. Un passage fait 14 lectures
    # d'au plus 20 s quand le site répond (http://www en deux redirections), jusqu'à 33 dans une boucle de redirections
    # lentes (11 min au plus). Le délai du job couvre ce pire cas : un écart fait échouer le job, il ne l'annule jamais.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Aucune dépendance : le script n'utilise que Node. Aucun secret.
      - name: Vérifier la production
        # --information ne s'applique plus en CI depuis la demande n° 26 (le job ne tourne que sur main) : gardé comme
        # garde-fou, si le job venait à tourner ailleurs.
        run: node scripts/verifier-production.ts ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && '--information' || '' }} ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '--apres-deploiement' || '' }}
