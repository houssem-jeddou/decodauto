name: Contrôles et déploiement

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  # Le site reste non indexable tant que la variable de dépôt SITE_INDEXABLE ne vaut pas exactement "true".
  SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}

jobs:
  controles:
    name: Contrôles (schémas, règles, build, liens)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Schémas et types
        run: npm run schemas
      - name: Tests des règles (pages de test valide et invalides)
        run: npm test
      - name: Construction + script de contrôle
        run: npm run build
      - name: Liens cassés
        run: npm run liens
      - name: Non-indexation, dans les deux sens (construction forcée dans chaque mode)
        run: |
          for mode in false true; do
            echo "::group::SITE_INDEXABLE=$mode"
            SITE_INDEXABLE=$mode npx astro build --outDir "dist-$mode"
            SITE_INDEXABLE=$mode node scripts/controle.ts --dist "dist-$mode"
            SITE_INDEXABLE=$mode node scripts/liens.ts --dist "dist-$mode"
            echo "::endgroup::"
          done
      - name: Conserver le site vérifié
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-verifie
          path: dist
          if-no-files-found: error
          retention-days: 7

  lighthouse:
    name: Lighthouse mobile (3 passages)
    needs: controles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-verifie
          path: dist
      - name: Lighthouse (mobile, médiane de 3 passages)
        run: npm run lighthouse
      - name: Conserver les rapports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 7

  secrets-cloudflare:
    name: Secrets Cloudflare présents ?
    needs: [controles, lighthouse]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      disponibles: ${{ steps.verification.outputs.disponibles }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: verification
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "disponibles=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponibles=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN et/ou CLOUDFLARE_ACCOUNT_ID absents : déploiement ignoré."
          fi

  deploiement:
    name: Déploiement Cloudflare (wrangler deploy)
    # Uniquement si tous les contrôles sont verts ET si les deux secrets existent.
    needs: [controles, lighthouse, secrets-cloudflare]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.secrets-cloudflare.outputs.disponibles == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # On déploie exactement le dossier qui a passé tous les contrôles, sans le reconstruire.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-verifie
          path: dist
      - name: Déployer
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
