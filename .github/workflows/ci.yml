name: Contrôles et déploiement

on:
  pull_request:
  push:
    branches: [main]
  # Contrôle hebdomadaire (lundi, 6 h 17 UTC) pour les alertes de revue dépassée. Jamais de déploiement.
  # GitHub ne lance les déclenchements planifiés que depuis la branche par défaut (main).
  schedule:
    - cron: '17 6 * * 1'
  # Lancement à la demande (onglet Actions) : contrôles et vérification de la production, jamais de déploiement.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  # Le site n'est indexable que si cette variable vaut exactement "true" ET si config/indexation.json vaut true.
  SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}

jobs:
  controles:
    name: Contrôles (schémas, règles, build, liens)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Schémas et types
        run: npm run schemas
      - name: Tests des règles (pages de test valide et invalides)
        run: npm test
      - name: Construction + script de contrôle
        run: npm run build
      - name: Liens cassés
        run: npm run liens
      - name: Non-indexation, double clé (variable + drapeau) dans les quatre combinaisons
        run: npm run verifier:modes
      - name: Alertes datées (revue dépassée, montant à revérifier, fourchette à revoir), contrôle hebdomadaire seulement
        if: ${{ github.event_name == 'schedule' }}
        run: node scripts/controle.ts --echouer-sur R5-REVUE-DEPASSEE,COUT-A-REVERIFIER,COUT-FOURCHETTE-A-REVOIR
      - name: Conserver le site vérifié
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-verifie
          path: dist
          if-no-files-found: error
          retention-days: 7

  exemples:
    name: Recette des exemples rédigés (jamais déployée)
    # Livrable 6.6 : les pages exemples de exemples/ (une par modèle de page) sont construites avec le site dans
    # dist-exemples, contrôlées comme de vraies pages, puis conservées pour la recette. Ce job ne conditionne pas le
    # déploiement et rien de dist-exemples n'est jamais déployé.
    # Erreurs attendues (--attendu, scripts/lib/attendus.ts), une par ligne, chacune désignée par son code, son fichier
    # et au besoin un extrait ; toute autre erreur fait échouer le job, et un attendu qui ne se produit plus aussi
    # (ATTENDU-ABSENT) :
    #  - R4-VALIDATION-ABSENTE d'un exemple tant que Houssem n'a pas validé son encadré : l'empreinte n'est versée
    #    qu'après sa validation, jamais pour faire passer le contrôle, et l'attendu est retiré dans le même commit ;
    # Aucun attendu aujourd'hui : la page « à propos » (livrable 7.3) existe dans exemples/, les liens « Méthode » mènent à elle.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AVEC_EXEMPLES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Construction avec les exemples (dist-exemples)
        run: npx astro build
      - name: Script de contrôle, exemples compris
        run: node scripts/controle.ts --dist dist-exemples --exemples
      - name: Liens cassés
        if: ${{ !cancelled() }}
        run: node scripts/liens.ts --dist dist-exemples --exemples
      - name: Texte rédigé des exemples, tel que rendu (lecture dans ce journal)
        if: ${{ !cancelled() }}
        run: node scripts/texte-exemples.ts dist-exemples
      - name: Lighthouse mobile de la page de chaque modèle (porte de l'étape 8 ; avec les emplacements publicitaires factices de la construction de recette, livrable 7.5b)
        if: ${{ !cancelled() }}
        run: npx lhci autorun --config=lighthouserc-exemples.json
      - name: Conserver la construction de recette
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exemples-recette
          path: dist-exemples
          if-no-files-found: error
          retention-days: 14

  lighthouse:
    name: Lighthouse mobile (3 passages)
    needs: controles
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-verifie
          path: dist
      - name: Lighthouse (mobile, médiane de 3 passages)
        run: npm run lighthouse
      - name: Conserver les rapports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 7

  origine-main:
    name: Origine des commits de main (garde-fou de déploiement)
    # Livrable 7.6, demande de changement n° 15 : refuse de déployer si un commit de main, depuis le dernier déploiement,
    # ne vient pas d'une pull request fusionnée dans main (scripts/verifier-origine-main.ts). Couvre l'accident, pas un
    # compte compromis : qui pousse sur main peut retirer ce contrôle dans le même envoi (le workflow exécuté est celui du
    # commit poussé). Un commit direct, relu par Houssem, s'accepte dans config/commits-directs-acceptes.json.
    # Le déploiement en dépend : un échec de lecture bloque, dans le doute on ne déploie pas.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Aucune dépendance : le script n'utilise que Node, Git et l'API GitHub.
      - name: Vérifier l'origine des commits
        run: node scripts/verifier-origine-main.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  secrets-cloudflare:
    name: Secrets Cloudflare présents ?
    needs: [controles, lighthouse]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      disponibles: ${{ steps.verification.outputs.disponibles }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: verification
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "disponibles=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponibles=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN et/ou CLOUDFLARE_ACCOUNT_ID absents : déploiement ignoré."
          fi

  deploiement:
    name: Déploiement Cloudflare (wrangler deploy)
    # Uniquement si tous les contrôles sont verts, si l'origine des commits de main est vérifiée (garde-fou, livrable 7.6)
    # ET si les deux secrets existent.
    needs: [controles, lighthouse, secrets-cloudflare, origine-main]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.secrets-cloudflare.outputs.disponibles == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # On déploie exactement le dossier qui a passé tous les contrôles, sans le reconstruire.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-verifie
          path: dist
      - name: Déployer
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    name: Production en ligne (redirections, noindex, robots.txt, plan du site)
    # Sur main (après un déploiement réussi, chaque semaine, à la demande) : un écart fait échouer le run
    # (notification GitHub). Sur une pull request ou une autre branche, la vérification est informative
    # (avertissements, job vert) : la production n'a pas encore les changements de la branche et dépend aussi des
    # réglages Cloudflare, hors du dépôt.
    needs: deploiement
    if: ${{ !cancelled() && (needs.deploiement.result == 'success' || github.event_name != 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Aucune dépendance : le script n'utilise que Node. Aucun secret.
      - name: Vérifier la production
        run: node scripts/verifier-production.ts ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && '--information' || '' }}
